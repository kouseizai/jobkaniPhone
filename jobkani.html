<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff69b4">
<title>深夜のコンビニ ~煩悩との戦い~</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #1a0033;
  color: #fff;
  font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
  position: fixed;
  inset: 0;
}
.screen.active { display: flex; flex-direction: column; }

/* ---- 警告画面 ---- */
#warning {
  background: linear-gradient(135deg, #ff006e, #8338ec, #3a0ca3);
  justify-content: center;
  align-items: center;
  padding: 20px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(30deg); }
}
.warning-box {
  background: rgba(0,0,0,0.7);
  border: 3px dashed #ff69b4;
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  max-width: 360px;
  width: 100%;
}
.warning-box h1 { font-size: 28px; margin-bottom: 16px; animation: shake 0.5s infinite; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-4px) rotate(-2deg); }
  75% { transform: translateX(4px) rotate(2deg); }
}
.warning-box p { margin: 12px 0; font-size: 16px; line-height: 1.5; }
.warning-box .age { color: #ffeb3b; font-weight: bold; margin-top: 20px; }

.btn-main, .btn-sub {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
}
.btn-main {
  background: linear-gradient(45deg, #ff006e, #ff69b4);
  color: #fff;
  box-shadow: 0 4px 0 #8b0a3d;
}
.btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #8b0a3d; }
.btn-sub {
  background: #444;
  color: #ccc;
}

/* ---- ゲーム画面 ---- */
#game {
  background: #000;
}
.status-bar {
  display: flex;
  justify-content: space-around;
  background: rgba(0,0,0,0.85);
  padding: 8px 4px;
  font-size: 13px;
  border-bottom: 2px solid #ff69b4;
  flex-wrap: wrap;
  gap: 4px;
}
.stat { white-space: nowrap; }
.stat span { color: #ffeb3b; font-weight: bold; }

.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #1a0033 0%, #4a148c 100%);
  display: flex;
  justify-content: center;
  align-items: center;
}
.bg {
  position: absolute;
  font-size: 100px;
  opacity: 0.3;
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-20px) rotate(5deg); }
}
.character {
  font-size: clamp(80px, 25vw, 160px);
  z-index: 2;
  transition: transform 0.3s;
  filter: drop-shadow(0 0 20px #ff69b4);
  text-align: center;
  line-height: 1;
}
.character.shake { animation: charShake 0.3s; }
@keyframes charShake {
  0%,100% { transform: scale(1); }
  25% { transform: scale(1.1) rotate(-5deg); }
  75% { transform: scale(1.1) rotate(5deg); }
}
.character.bounce { animation: bounce 0.6s; }
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-30px) scale(1.2); }
}
.effect {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.effect.heart::before {
  content: "💕💖💗💓💞";
  position: absolute;
  font-size: 40px;
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  animation: rise 1.2s ease-out;
}
@keyframes rise {
  0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
  100% { opacity: 0; transform: translate(-50%, -200px) scale(2); }
}
.effect.flash {
  background: #fff;
  animation: flash 0.4s;
}
@keyframes flash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

.dialogue-box {
  background: linear-gradient(180deg, rgba(20,0,40,0.95), rgba(40,0,60,0.95));
  border-top: 3px solid #ff69b4;
  padding: 12px 16px 16px;
  min-height: 180px;
  max-height: 50vh;
  overflow-y: auto;
  position: relative;
}
.speaker {
  display: inline-block;
  background: #ff006e;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}
.text {
  font-size: 16px;
  line-height: 1.6;
  min-height: 50px;
  white-space: pre-wrap;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
.choices button {
  background: rgba(255,105,180,0.2);
  border: 2px solid #ff69b4;
  color: #fff;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all 0.2s;
}
.choices button:active {
  background: #ff69b4;
  transform: scale(0.98);
}
.next-hint {
  position: absolute;
  bottom: 6px;
  right: 12px;
  font-size: 12px;
  color: #ff69b4;
  animation: blink 1s infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.next-hint.hidden { display: none; }

.menu-btn {
  position: fixed;
  top: 4px;
  right: 8px;
  background: rgba(0,0,0,0.7);
  color: #fff;
  border: 1px solid #ff69b4;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  z-index: 10;
  cursor: pointer;
}
.menu {
  display: none;
  position: fixed;
  top: 40px;
  right: 8px;
  background: rgba(0,0,0,0.9);
  border: 1px solid #ff69b4;
  border-radius: 8px;
  padding: 8px;
  z-index: 11;
}
.menu.show { display: block; }
.menu button {
  display: block;
  width: 120px;
  padding: 8px;
  margin: 4px 0;
  background: #ff006e;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-family: inherit;
  cursor: pointer;
}

/* ---- エンディング ---- */
#ending {
  background: radial-gradient(circle, #ff006e, #1a0033);
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.ending-box {
  background: rgba(0,0,0,0.85);
  border: 3px solid gold;
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
  max-width: 360px;
  width: 100%;
}
.ending-box h1 {
  font-size: 24px;
  color: gold;
  margin-bottom: 20px;
  animation: shake 1s infinite;
}
.ending-box p {
  font-size: 16px;
  line-height: 1.6;
  margin: 16px 0;
}
.ending-box .rank {
  font-size: 48px;
  font-weight: bold;
  color: #ff69b4;
  text-shadow: 0 0 20px #ff006e;
  margin: 20px 0;
}

</style>
</head>
<body>
<div id="warning" class="screen active">
  <div class="warning-box">
    <h1>⚠️ 警告 ⚠️</h1>
    <p>このゲームは<br><strong>馬鹿</strong>です。</p>
    <p>クオリティに期待しないでください。</p>
    <p>酔った状態でのプレイを推奨します。</p>
    <p class="age">18歳未満禁止<br>(なんとなく)</p>
    <button class="btn-main" onclick="startGame()">酔ってる、入る</button>
    <button class="btn-sub" onclick="alert('帰っていいよ')">素面なので帰る</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="status-bar">
    <div class="stat">❤️HP <span id="hp">100</span></div>
    <div class="stat">🍺酔 <span id="drunk">50</span></div>
    <div class="stat">🔥煩悩 <span id="bonnou">99</span></div>
    <div class="stat">💴 <span id="money">300</span>円</div>
  </div>

  <div class="stage" id="stage">
    <div class="bg" id="bg">🌙</div>
    <div class="character" id="char"></div>
    <div class="effect" id="effect"></div>
  </div>

  <div class="dialogue-box">
    <div class="speaker" id="speaker">？？？</div>
    <div class="text" id="text"></div>
    <div class="choices" id="choices"></div>
    <div class="next-hint" id="nextHint">▼タップで次へ</div>
  </div>

  <button class="menu-btn" onclick="toggleMenu()">≡</button>
  <div class="menu" id="menu">
    <button onclick="restart()">最初から</button>
    <button onclick="toggleMenu()">閉じる</button>
  </div>
</div>

<div id="ending" class="screen">
  <div class="ending-box">
    <h1 id="endingTitle">エンディング</h1>
    <p id="endingText"></p>
    <p class="rank" id="endingRank"></p>
    <button class="btn-main" onclick="restart()">もう一度</button>
  </div>
</div>

<audio id="bgm" loop></audio>

<script>
// 深夜のコンビニ ~煩悩との戦い~
// Yolo製造、品質保証なし

const state = {
  hp: 100,
  drunk: 50,
  bonnou: 99,
  money: 300,
  flags: {},
  scene: "start",
  index: 0,
  typing: false,
  fullText: ""
};

function $(id) { return document.getElementById(id); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function startGame() {
  showScreen("game");
  state.scene = "start";
  state.index = 0;
  runScene();
}

function restart() {
  state.hp = 100;
  state.drunk = 50;
  state.bonnou = 99;
  state.money = 300;
  state.flags = {};
  showScreen("warning");
}

function updateStatus() {
  $("hp").textContent = state.hp;
  $("drunk").textContent = state.drunk;
  $("bonnou").textContent = state.bonnou;
  $("money").textContent = state.money;
}

function toggleMenu() {
  $("menu").classList.toggle("show");
}

function setChar(emoji, fx) {
  const c = $("char");
  c.textContent = emoji;
  c.className = "character";
  if (fx) {
    void c.offsetWidth;
    c.classList.add(fx);
  }
}
function setBg(emoji) { $("bg").textContent = emoji; }
function effect(name) {
  const e = $("effect");
  e.className = "effect " + name;
  setTimeout(() => e.className = "effect", 1200);
}

// ============== シナリオ ==============
const scenes = {
  start: [
    { bg: "🌙", char: "🍶", speaker: "ナレーション",
      text: "深夜2時。\n君は飲み会の帰り、なぜかコンビニにいる。\n財布の中には300円。腹の中にはビール5杯。" },
    { speaker: "心の声", char: "🤤",
      text: "(なんか…甘いもの食べたい…)\n(あと…なんかエッチな気分…)\n(なんで?知らん。酒のせい。)" },
    { speaker: "心の声", char: "🤔",
      text: "コンビニの自動ドアが、君を待っている。\nどうする?",
      choices: [
        { text: "とりあえず入る(普通)", next: "kombini1" },
        { text: "ドアの前で深呼吸する(変態)", next: "deep_breath", effect: () => { state.bonnou += 10; } },
        { text: "やっぱ帰る", next: "go_home" }
      ]
    }
  ],

  go_home: [
    { speaker: "ナレーション", char: "🚶",
      text: "君は賢明にも家に帰った。\nそして布団に倒れ込んだ。\n…なにも起きなかった。" },
    { ending: "賢者エンド", rank: "S",
      text: "煩悩に打ち勝った君は、明日も健全な社会人として目覚めるだろう。\n…つまんねぇ人生だな。" }
  ],

  deep_breath: [
    { speaker: "通行人", char: "👮",
      text: "「お兄さん、大丈夫?」\n警察官に職務質問された。", effect: () => { state.bonnou -= 5; }
    },
    { speaker: "主人公", char: "😅",
      text: "「だ、大丈夫です!ちょっと酔ってて…」\n命からがらコンビニに入った。",
      next: "kombini1"
    }
  ],

  kombini1: [
    { bg: "🏪", char: "💁‍♀️", speaker: "店員",
      text: "「いらっしゃいませ〜♡」\n\nなんか…店員さん、めっちゃテンション高くない?\nしかも、深夜なのに完璧なメイク。" },
    { speaker: "店員", char: "💁‍♀️",
      text: "「お兄さん、お酒入ってる?\nウチの店、今日特別キャンペーン中なんですよ〜♡」",
      effect: () => { effect("heart"); }
    },
    { speaker: "心の声", char: "🤨",
      text: "(キャンペーン…?\n深夜のコンビニで…?\n絶対なんかおかしいやろ。)",
      choices: [
        { text: "「どんなキャンペーンですか?」(乗る)", next: "campaign" },
        { text: "「いえ、結構です」(冷静)", next: "shopping" },
        { text: "「結婚してください」(酔っ払い)", next: "propose", effect: () => { state.drunk += 20; } }
      ]
    }
  ],

  propose: [
    { speaker: "店員", char: "😨",
      text: "「えっ……」\n\n店内が静まり返った。\n冷蔵庫の音だけが響く。" },
    { speaker: "店員", char: "😤",
      text: "「お兄さん、酔っ払いすぎ!\nちゃんと水買って帰って!」\n\n君は2リットルの水を強制購入させられた。",
      effect: () => { state.money -= 200; state.drunk -= 30; state.bonnou -= 20; }
    },
    { next: "shopping" }
  ],

  campaign: [
    { speaker: "店員", char: "💁‍♀️",
      text: "「えっとですね〜♡\nお会計の時に\n『今夜、月が綺麗ですね』\nって言ってくれたら……」",
      effect: () => { effect("heart"); }
    },
    { speaker: "店員", char: "😏",
      text: "「秘密のサービスがあります♡」\n\n秘密のサービス。\nおい。なんだそれ。" },
    { speaker: "心の声", char: "🥵",
      text: "(待て待て待て。\n冷静になれ俺。\nこれ絶対、罠か詐欺か、最高の夜の始まりかのどれかだ。)",
      effect: () => { state.bonnou += 15; }
    },
    { next: "shopping" }
  ],

  shopping: [
    { bg: "🥫", char: "🛒", speaker: "ナレーション",
      text: "とりあえず買い物しよう。\n何を買う?",
      choices: [
        { text: "肉まん(120円)", next: "nikuman", effect: () => { state.money -= 120; state.hp += 20; } },
        { text: "エナドリ(200円)", next: "energy", effect: () => { state.money -= 200; state.drunk -= 20; state.hp += 10; } },
        { text: "謎の新商品『恋する豆乳』(180円)", next: "tounyu", effect: () => { state.money -= 180; state.bonnou += 30; } },
        { text: "何も買わない", next: "kaikei" }
      ]
    }
  ],

  nikuman: [
    { speaker: "ナレーション", char: "🥟",
      text: "肉まんを温めてもらった。\nふっくらしてて、いい匂い。\n人生で一番美味そうに見えた。",
      next: "kaikei"
    }
  ],

  energy: [
    { speaker: "ナレーション", char: "⚡",
      text: "謎の海外製エナドリ。\n缶に『FOR REAL MAN』と書いてある。\n不安。",
      next: "kaikei"
    }
  ],

  tounyu: [
    { speaker: "店員", char: "😍",
      text: "「お兄さん、それ選ぶの!?\nセンスありますね♡\nそれ、飲んだ人みんな……うふふ」" },
    { speaker: "心の声", char: "😱",
      text: "(うふふ、じゃねぇよ。\n何が起きるんだよ。)",
      effect: () => { state.bonnou += 20; },
      next: "kaikei"
    }
  ],

  kaikei: [
    { bg: "💰", char: "💁‍♀️", speaker: "店員",
      text: "「お会計、ご一緒に温めますか〜?♡」\n\n温めるのは商品か、それとも……" },
    { speaker: "心の声", char: "🤯",
      text: "ここで例の合言葉を言うかどうか……\n月、綺麗かな?",
      choices: [
        { text: "「今夜、月が綺麗ですね」", next: "secret", effect: () => { state.bonnou += 20; } },
        { text: "普通に支払う", next: "normal_pay" },
        { text: "「あなたが月です」", next: "tsuki_dayo", effect: () => { state.drunk += 10; } }
      ]
    }
  ],

  tsuki_dayo: [
    { speaker: "店員", char: "🤣",
      text: "「ぶふっ……ww\nおにいさんwww\n酔っ払いすぎですってww」\n\n店員さん、笑い崩れた。" },
    { speaker: "店員", char: "😊",
      text: "「でも、ちょっと面白いから\nおまけしときます♡」\n\nおにぎりをサービスしてもらった。",
      effect: () => { state.hp += 30; state.bonnou += 5; },
      next: "exit"
    }
  ],

  normal_pay: [
    { speaker: "ナレーション", char: "💴",
      text: "普通に支払った。\n普通にお釣りをもらった。\n普通の夜。",
      next: "exit"
    }
  ],

  secret: [
    { speaker: "店員", char: "😳",
      text: "「……っ!\nほ、本当に言うなんて……」\n\n店員さんの顔が真っ赤になった。",
      effect: () => { effect("flash"); }
    },
    { speaker: "店員", char: "💋",
      text: "「じゃあ……バックヤードに来てください……\nレジ閉めるんで……♡」" },
    { speaker: "心の声", char: "🤤",
      text: "(まさか…!?\nまさかこれは…!?)",
      choices: [
        { text: "ついていく(行くしかない)", next: "backyard" },
        { text: "「やっぱやめときます!」と逃げる", next: "escape" }
      ]
    }
  ],

  escape: [
    { speaker: "ナレーション", char: "🏃",
      text: "君は走って逃げた。\n肉まんを握りしめて。\n夜風が冷たい。" },
    { ending: "ヘタレエンド", rank: "C",
      text: "賢明な判断だったかもしれない。\nでも、君は一生『あの時行ってればなぁ』と言い続けるだろう。\n知らんけど。"
    }
  ],

  backyard: [
    { bg: "📦", char: "🚪", speaker: "ナレーション",
      text: "バックヤードに通された。\n段ボールが積まれた、薄暗い部屋。\n胸の鼓動が早い。" },
    { speaker: "店員", char: "😈",
      text: "「お兄さん……♡\n覚悟、できてます……?」",
      effect: () => { effect("heart"); }
    },
    { speaker: "心の声", char: "🥵",
      text: "(きた…!\nついに俺の青春が…!)\n\nゴクリ。",
      next: "reveal"
    }
  ],

  reveal: [
    { speaker: "店員", char: "🎤",
      text: "「ジャジャーン!!\n当店、24時間カラオケキャンペーン中!!\n一緒に歌いましょう!!!」",
      effect: () => { effect("flash"); }
    },
    { bg: "🎤", char: "😶", speaker: "心の声",
      text: "(……は?)\n(カラオケ?)\n(カラオケって…えっと…あの…歌う方の?)" },
    { speaker: "店員", char: "🎶",
      text: "「バックヤード、防音なんですよ〜♡\n深夜だからストレス発散しに来てくれたお客さんに\n秘密のカラオケサービスしてるんです♡」",
      choices: [
        { text: "「…じゃあ、歌います」(諦め)", next: "sing" },
        { text: "「ふざけんな!」とキレる", next: "blow_up" },
        { text: "「いやでも俺、月が…」", next: "tsuki_chigau" }
      ]
    }
  ],

  tsuki_chigau: [
    { speaker: "店員", char: "😇",
      text: "「えっ?月?何の話ですか?\nウチの合言葉は『カラオケしたい』ですよ?\nお客さん、何か変な勘違いしてません?w」"
    },
    { speaker: "心の声", char: "💀",
      text: "(\\(^o^)/オワタ)\n(俺はとんでもない勘違い野郎だ……)",
      next: "sing"
    }
  ],

// ============== ゲームエンジン ==============
function runScene() {
  const scene = scenes[state.scene];
  if (!scene) return;
  if (state.index >= scene.length) return;

  const node = scene[state.index];

  if (node.ending) {
    showEnding(node);
    return;
  }

  if (node.bg) setBg(node.bg);
  if (node.char) setChar(node.char, "bounce");
  if (node.speaker) $("speaker").textContent = node.speaker;
  if (node.effect) node.effect();

  updateStatus();

  $("choices").innerHTML = "";
  $("nextHint").classList.add("hidden");

  if (node.text) {
    typeText(node.text, () => {
      if (node.choices) {
        renderChoices(node.choices);
      } else if (node.next) {
        $("nextHint").classList.remove("hidden");
        waitTap(() => {
          state.scene = node.next;
          state.index = 0;
          runScene();
        });
      } else {
        $("nextHint").classList.remove("hidden");
        waitTap(() => {
          state.index++;
          runScene();
        });
      }
    });
  } else if (node.next) {
    state.scene = node.next;
    state.index = 0;
    runScene();
  }
}

function typeText(text, done) {
  state.typing = true;
  state.fullText = text;
  const el = $("text");
  el.textContent = "";
  let i = 0;
  const speed = 30;
  function step() {
    if (!state.typing) {
      el.textContent = text;
      done();
      return;
    }
    if (i < text.length) {
      el.textContent += text[i++];
      setTimeout(step, speed);
    } else {
      state.typing = false;
      done();
    }
  }
  step();
}

function renderChoices(choices) {
  const c = $("choices");
  c.innerHTML = "";
  choices.forEach(ch => {
    const btn = document.createElement("button");
    btn.textContent = ch.text;
    btn.onclick = () => {
      if (ch.effect) ch.effect();
      state.scene = ch.next;
      state.index = 0;
      runScene();
    };
    c.appendChild(btn);
  });
}

let tapHandler = null;
function waitTap(callback) {
  if (tapHandler) document.removeEventListener("click", tapHandler);
  tapHandler = (e) => {
    if (e.target.closest(".choices") || e.target.closest(".menu-btn") || e.target.closest(".menu")) return;
    if (state.typing) {
      state.typing = false;
      return;
    }
    document.removeEventListener("click", tapHandler);
    tapHandler = null;
    callback();
  };
  setTimeout(() => document.addEventListener("click", tapHandler), 100);
}

function showEnding(node) {
  showScreen("ending");
  $("endingTitle").textContent = "🎉 " + node.ending + " 🎉";
  $("endingText").textContent = node.text;
  $("endingRank").textContent = "RANK: " + node.rank;
}
