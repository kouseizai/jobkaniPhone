<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff1493">
<title>深夜の極上スナック『ぽよん』</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100vh; height: 100dvh;
  overflow: hidden;
  background: #1a0033;
  color: #fff;
  font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", system-ui, sans-serif;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  position: fixed;
}

#title {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, #ff006e 0%, #5a0099 50%, #1a0033 100%);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 100; padding: 20px; text-align: center;
}
#title.hidden { display: none; }
#title h1 {
  font-size: clamp(28px, 8vw, 48px);
  text-shadow: 4px 4px 0 #000, -2px -2px 0 #ff69b4, 0 0 30px #ff1493;
  animation: wobble 2s infinite, neonFlicker 3s infinite;
  margin-bottom: 8px;
  color: #fff;
}
#title h2 {
  font-size: clamp(16px, 4vw, 22px);
  color: #ffeb3b;
  text-shadow: 2px 2px 0 #ff006e;
  animation: tada 1.5s infinite;
  margin-bottom: 24px;
}
@keyframes wobble {
  0%,100% { transform: rotate(-3deg) scale(1); }
  50% { transform: rotate(3deg) scale(1.05); }
}
@keyframes tada {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15) rotate(-2deg); }
}
@keyframes neonFlicker {
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
  20%, 24%, 55% { opacity: 0.6; }
}
.title-poyon {
  font-size: 100px;
  animation: hopBig 0.6s infinite;
  margin-bottom: 16px;
  display: inline-block;
  filter: drop-shadow(0 0 20px #ff1493);
}
@keyframes hopBig {
  0%,100% { transform: translateY(0) scale(1, 1); }
  50% { transform: translateY(-30px) scale(0.9, 1.1); }
}
.start-btn {
  background: linear-gradient(45deg, #ff006e, #ff69b4, #ffeb3b);
  background-size: 200% 200%;
  animation: rainbow 2s linear infinite;
  border: 4px solid #fff;
  color: #fff;
  padding: 18px 36px;
  font-size: 22px;
  font-weight: 900;
  border-radius: 50px;
  box-shadow: 0 6px 0 #8b0a3d, 0 0 30px #ff1493;
  cursor: pointer;
  font-family: inherit;
  text-shadow: 2px 2px 0 #000;
  letter-spacing: 2px;
}
.start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8b0a3d; }
@keyframes rainbow {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.title-warn {
  margin-top: 24px;
  font-size: 12px;
  color: #ffeb3b;
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
  border-radius: 20px;
  max-width: 320px;
}

#game {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,0,110,0.3), transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(138,43,226,0.4), transparent 50%),
    linear-gradient(180deg, #2a0044 0%, #4a0e7a 100%);
}

.hud {
  background: rgba(0,0,0,0.75);
  border-bottom: 2px solid #ff1493;
  padding: 6px 8px;
  display: flex; flex-direction: column;
  gap: 4px;
  font-size: 11px;
}
.hud-row { display: flex; gap: 6px; align-items: center; }
.hud-row label { min-width: 50px; }
.bar {
  flex: 1; height: 14px;
  background: rgba(255,255,255,0.1);
  border: 1px solid #fff;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%; width: 0%;
  transition: width 0.4s cubic-bezier(.5,1.5,.5,1);
  background: linear-gradient(90deg, #ff006e, #ff69b4);
}
.bar.bar-love .bar-fill { background: linear-gradient(90deg, #ff006e, #ff1493, #ffeb3b); }
.bar.bar-drunk .bar-fill { background: linear-gradient(90deg, #ffeb3b, #ff8c00, #ff0000); }
.bar.bar-money .bar-fill { background: linear-gradient(90deg, #00ff7f, #00bfff); }
.bar-text {
  position: absolute; inset: 0;
  text-align: center; line-height: 14px;
  font-size: 10px; font-weight: bold;
  color: #fff; text-shadow: 1px 1px 0 #000;
}

.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.bg-deco {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-deco::before, .bg-deco::after {
  content: "🌃🍸🍶🍺🥃🌃🍸🍶🍺🥃🌃🍸🍶🍺🥃";
  position: absolute;
  font-size: 30px;
  opacity: 0.15;
  white-space: nowrap;
  animation: scrollBg 20s linear infinite;
}
.bg-deco::before { top: 10%; }
.bg-deco::after { top: 70%; animation-duration: 30s; animation-direction: reverse; }
@keyframes scrollBg {
  0% { transform: translateX(-50%); }
  100% { transform: translateX(50%); }
}

.disco-light {
  position: absolute;
  width: 200%; height: 200%;
  top: -50%; left: -50%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(255,20,147,0.15) 30deg, transparent 60deg, rgba(0,255,255,0.15) 90deg, transparent 120deg, rgba(255,255,0,0.15) 150deg, transparent 180deg);
  animation: spin 8s linear infinite;
  pointer-events: none;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.poyon {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px; height: 320px;
  cursor: pointer;
  animation: breathing 2s ease-in-out infinite;
}
.poyon.shake { animation: charShake 0.4s, breathing 2s ease-in-out infinite 0.4s; }
.poyon.drunk { animation: drunkSway 1.5s ease-in-out infinite; }
.poyon.happy { animation: happyJump 0.5s ease-in-out infinite; }
@keyframes breathing {
  0%,100% { transform: translateX(-50%) scale(1, 1); }
  50% { transform: translateX(-50%) scale(1.02, 0.99); }
}
@keyframes charShake {
  0%,100% { transform: translateX(-50%) scale(1); }
  20% { transform: translateX(-58%) scale(1.05) rotate(-3deg); }
  60% { transform: translateX(-42%) scale(1.05) rotate(3deg); }
}
@keyframes drunkSway {
  0%,100% { transform: translateX(-50%) rotate(-5deg); }
  50% { transform: translateX(-50%) rotate(5deg); }
}
@keyframes happyJump {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-15px); }
}

.hair {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 140px; height: 90px;
  background: #6b3410;
  border-radius: 70px 70px 30px 30px;
  z-index: 1;
}
.hair::before {
  content: "";
  position: absolute;
  width: 30px; height: 60px;
  background: #6b3410;
  border-radius: 50%;
  top: 30px; left: -10px;
}
.hair::after {
  content: "";
  position: absolute;
  width: 30px; height: 60px;
  background: #6b3410;
  border-radius: 50%;
  top: 30px; right: -10px;
}
.ribbon {
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%);
  font-size: 30px;
  z-index: 2;
  animation: ribbonWiggle 1s ease-in-out infinite;
}
@keyframes ribbonWiggle {
  0%,100% { transform: translateX(-50%) rotate(-10deg); }
  50% { transform: translateX(-50%) rotate(10deg); }
}

.face {
  position: absolute;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 130px;
  background: #ffd9b3;
  border-radius: 50%;
  z-index: 2;
  border: 2px solid #2a1a0a;
}
.face .blush {
  position: absolute;
  width: 20px; height: 12px;
  background: #ff6b9d;
  border-radius: 50%;
  top: 70px;
  opacity: 0.7;
}
.face .blush.left { left: 12px; }
.face .blush.right { right: 12px; }
.face .blush.deep { background: #ff0040; opacity: 1; width: 28px; height: 16px; }

.eye {
  position: absolute;
  top: 50px;
  width: 18px; height: 22px;
  background: #2a1a0a;
  border-radius: 50%;
  transition: all 0.3s;
}
.eye.left { left: 26px; }
.eye.right { right: 26px; }
.eye::after {
  content: "";
  position: absolute;
  width: 6px; height: 6px;
  background: #fff;
  border-radius: 50%;
  top: 3px; left: 4px;
}
.eye.heart {
  background: transparent;
  width: 22px; height: 22px;
  font-size: 22px;
  color: #ff006e;
  text-align: center;
  line-height: 22px;
}
.eye.heart::before { content: "♥"; }
.eye.heart::after { display: none; }
.eye.swirl {
  background: transparent;
  font-size: 22px;
  color: #2a1a0a;
  line-height: 22px;
  text-align: center;
}
.eye.swirl::before { content: "@"; animation: spin 1s linear infinite; display: inline-block; }
.eye.swirl::after { display: none; }

.mouth {
  position: absolute;
  bottom: 25px; left: 50%;
  transform: translateX(-50%);
  width: 30px; height: 12px;
  background: #ff006e;
  border-radius: 0 0 20px 20px;
  transition: all 0.3s;
}
.mouth.smile { width: 40px; height: 18px; border-radius: 0 0 25px 25px; }
.mouth.kiss { width: 18px; height: 18px; border-radius: 50%; background: #ff1493; }
.mouth.shock { width: 22px; height: 22px; border-radius: 50%; background: #2a1a0a; }

.body-top {
  position: absolute;
  top: 130px; left: 50%;
  transform: translateX(-50%);
  width: 150px; height: 100px;
  background: #ff006e;
  border-radius: 30px 30px 10px 10px;
  z-index: 1;
  border: 2px solid #2a1a0a;
}
.body-top::before {
  content: "♡";
  position: absolute;
  top: 38px; left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  color: #ffeb3b;
}

.poyon-bumps {
  position: absolute;
  top: 145px; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 50px;
  z-index: 2;
  pointer-events: none;
}
.bump {
  position: absolute;
  width: 50px; height: 45px;
  background: radial-gradient(circle at 30% 30%, #ffb6c1, #ff006e);
  border-radius: 50%;
  top: 0;
  border: 2px solid #2a1a0a;
  animation: jiggle 2s ease-in-out infinite;
}
.bump.left { left: 0; animation-delay: 0s; }
.bump.right { right: 0; animation-delay: 0.1s; }
@keyframes jiggle {
  0%,100% { transform: translateY(0) scale(1,1); }
  25% { transform: translateY(-3px) scale(1.05,0.95); }
  75% { transform: translateY(3px) scale(0.95,1.05); }
}
.poyon.shake .bump { animation: jiggleHard 0.4s ease-in-out infinite; }
@keyframes jiggleHard {
  0%,100% { transform: translateY(0) scale(1); }
  25% { transform: translateY(-8px) scale(1.2, 0.8); }
  50% { transform: translateY(0) scale(0.85, 1.15); }
  75% { transform: translateY(-4px) scale(1.1, 0.9); }
}

.skirt {
  position: absolute;
  top: 215px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 90px solid transparent;
  border-right: 90px solid transparent;
  border-top: 70px solid #4a0e7a;
  z-index: 0;
}

.arm {
  position: absolute;
  top: 150px;
  width: 20px; height: 80px;
  background: #ffd9b3;
  border: 2px solid #2a1a0a;
  border-radius: 10px;
  z-index: 0;
  transition: transform 0.3s;
}
.arm.left { left: 22px; transform: rotate(15deg); transform-origin: top center; }
.arm.right { right: 22px; transform: rotate(-15deg); transform-origin: top center; }
.poyon.happy .arm.left { animation: armWaveLeft 0.5s ease-in-out infinite; }
.poyon.happy .arm.right { animation: armWaveRight 0.5s ease-in-out infinite; }
@keyframes armWaveLeft {
  0%,100% { transform: rotate(15deg); }
  50% { transform: rotate(-30deg); }
}
@keyframes armWaveRight {
  0%,100% { transform: rotate(-15deg); }
  50% { transform: rotate(30deg); }
}

.speech {
  position: absolute;
  background: #fff;
  color: #2a1a0a;
  border: 3px solid #ff006e;
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: bold;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  z-index: 10;
  animation: speechIn 0.3s;
  box-shadow: 3px 3px 0 #2a1a0a;
  max-width: 90%;
}
.speech::after {
  content: "";
  position: absolute;
  bottom: -12px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 12px solid #ff006e;
}
@keyframes speechIn {
  0% { transform: translateX(-50%) scale(0); }
  60% { transform: translateX(-50%) scale(1.2); }
  100% { transform: translateX(-50%) scale(1); }
}
.speech.hidden { display: none; }

.float-icon {
  position: absolute;
  font-size: 40px;
  pointer-events: none;
  animation: floatUp 1.5s ease-out forwards;
  z-index: 20;
  text-shadow: 0 0 10px #fff;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, 0) scale(0.5) rotate(0); }
  20% { opacity: 1; transform: translate(-50%, -20px) scale(1.5) rotate(-15deg); }
  100% { opacity: 0; transform: translate(-50%, -200px) scale(1.8) rotate(360deg); }
}

.boom-text {
  position: absolute;
  font-size: 48px;
  font-weight: 900;
  color: #ffeb3b;
  -webkit-text-stroke: 3px #ff006e;
  pointer-events: none;
  animation: boomText 0.8s ease-out forwards;
  z-index: 25;
  white-space: nowrap;
  font-family: "Impact", "Hiragino Maru Gothic ProN", sans-serif;
}
@keyframes boomText {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-15deg); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.4) rotate(8deg); }
  60% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-3deg); }
  100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5) rotate(15deg); }
}

.fx-overlay {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 50;
}
.flash-white {
  position: absolute; inset: 0;
  background: #fff;
  animation: flashFade 0.4s forwards;
}
@keyframes flashFade {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
.flash-red {
  position: absolute; inset: 0;
  background: #ff0040;
  animation: flashFade 0.5s forwards;
}
.flash-rainbow {
  position: absolute; inset: 0;
  background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
  background-size: 200% 200%;
  animation: rainbowFlash 1s forwards;
  mix-blend-mode: overlay;
}
@keyframes rainbowFlash {
  0% { opacity: 0; background-position: 0% 0%; }
  50% { opacity: 1; background-position: 100% 100%; }
  100% { opacity: 0; background-position: 0% 0%; }
}

.shake-screen { animation: screenShake 0.3s; }
@keyframes screenShake {
  0%,100% { transform: translate(0, 0); }
  20% { transform: translate(-6px, 3px); }
  40% { transform: translate(5px, -4px); }
  60% { transform: translate(-3px, 5px); }
  80% { transform: translate(4px, -2px); }
}

.actions {
  background: rgba(0,0,0,0.85);
  border-top: 3px solid #ff1493;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.act-btn {
  background: linear-gradient(180deg, #ff006e, #8b0a3d);
  border: 2px solid #fff;
  color: #fff;
  padding: 10px 4px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 2px;
  box-shadow: 0 3px 0 #5a0024;
  transition: all 0.1s;
}
.act-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #5a0024;
  background: linear-gradient(180deg, #ff69b4, #ff006e);
}
.act-btn .ico { font-size: 24px; }
.act-btn .cost { font-size: 9px; color: #ffeb3b; }

.scene-label {
  position: absolute;
  top: 8px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  border: 2px solid #ffeb3b;
  padding: 4px 16px;
  border-radius: 16px;
  font-size: 12px;
  z-index: 5;
  color: #ffeb3b;
}

.menu-btn {
  position: fixed;
  top: 4px; right: 6px;
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.7);
  border: 1px solid #ff1493;
  border-radius: 50%;
  color: #fff; font-size: 16px;
  cursor: pointer;
  z-index: 200;
}
.menu-pop {
  position: fixed;
  top: 38px; right: 6px;
  background: rgba(0,0,0,0.95);
  border: 2px solid #ff1493;
  border-radius: 10px;
  padding: 8px;
  z-index: 200;
  display: none;
}
.menu-pop.show { display: block; }
.menu-pop button {
  display: block;
  width: 140px;
  margin: 4px 0;
  padding: 8px;
  background: #ff006e;
  border: none;
  color: #fff;
  border-radius: 6px;
  font-family: inherit;
  cursor: pointer;
  font-size: 13px;
}

#ending {
  position: fixed; inset: 0;
  background: radial-gradient(circle, #ff006e 0%, #1a0033 80%);
  display: none;
  justify-content: center; align-items: center;
  flex-direction: column;
  z-index: 300;
  padding: 20px;
  text-align: center;
}
#ending.show { display: flex; }
#ending .big-emoji {
  font-size: 100px;
  margin-bottom: 16px;
  animation: hopBig 0.6s infinite;
}
#ending h1 {
  font-size: 28px;
  color: #ffeb3b;
  text-shadow: 3px 3px 0 #000;
  margin-bottom: 12px;
  animation: tada 1s infinite;
}
#ending p {
  font-size: 15px;
  margin: 16px 0;
  max-width: 320px;
  line-height: 1.6;
  background: rgba(0,0,0,0.6);
  padding: 12px;
  border-radius: 12px;
  white-space: pre-line;
}
#ending .rank-display {
  font-size: 80px;
  font-weight: 900;
  color: #fff;
  text-shadow: 4px 4px 0 #ff006e, -2px -2px 0 #00bfff;
  margin: 8px 0;
  animation: wobble 1s infinite;
}

.confetti {
  position: absolute;
  width: 10px; height: 14px;
  pointer-events: none;
  z-index: 30;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

#minigame {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 250;
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 20px;
}
#minigame.show { display: flex; }
.mg-title {
  font-size: 20px;
  color: #ffeb3b;
  text-shadow: 2px 2px 0 #ff006e;
  margin-bottom: 16px;
  text-align: center;
  line-height: 1.5;
}
.mg-bar-wrap {
  width: 90%; max-width: 320px;
  height: 50px;
  background: #222;
  border: 3px solid #fff;
  border-radius: 25px;
  overflow: hidden;
  position: relative;
  margin-bottom: 24px;
}
.mg-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00ff7f, #ffeb3b, #ff006e);
  transition: width 0.05s linear;
}
.mg-target {
  position: absolute;
  top: -3px; bottom: -3px;
  left: 60%;
  width: 20%;
  background: rgba(255,255,255,0.25);
  border-left: 3px solid #fff;
  border-right: 3px solid #fff;
  box-sizing: border-box;
}
.mash-btn {
  width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff69b4, #ff006e);
  border: 6px solid #fff;
  color: #fff;
  font-size: 26px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 10px 0 #5a0024, 0 0 30px #ff1493;
  font-family: inherit;
  line-height: 1.1;
}
.mash-btn:active { transform: translateY(4px); box-shadow: 0 6px 0 #5a0024; }
.mg-counter {
  margin-top: 16px;
  font-size: 16px;
  color: #ffeb3b;
  text-align: center;
}
</style>
</head>
<body>

<div id="title">
  <div class="title-poyon">🍑</div>
  <h1>深夜の極上スナック<br>『ぽよん』</h1>
  <h2>~煩悩との戦い~</h2>
  <button class="start-btn" id="btnStart">入店する</button>
  <div class="title-warn">
    ⚠️ クオリティに期待するな<br>
    酔った状態でのプレイ推奨<br>
    18禁(なんとなく)
  </div>
</div>

<div id="game">
  <div class="hud">
    <div class="hud-row">
      <label>💖好感度</label>
      <div class="bar bar-love"><div class="bar-fill" id="barLove"></div><div class="bar-text" id="txtLove">0/100</div></div>
    </div>
    <div class="hud-row">
      <label>🍺酔い</label>
      <div class="bar bar-drunk"><div class="bar-fill" id="barDrunk"></div><div class="bar-text" id="txtDrunk">0/100</div></div>
    </div>
    <div class="hud-row">
      <label>💴所持金</label>
      <div class="bar bar-money"><div class="bar-fill" id="barMoney"></div><div class="bar-text" id="txtMoney">5000円</div></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="bg-deco"></div>
    <div class="disco-light"></div>
    <div class="scene-label" id="sceneLabel">STAGE 1: お通し</div>

    <div class="poyon" id="poyon">
      <div class="hair"></div>
      <div class="ribbon">🎀</div>
      <div class="face">
        <div class="eye left" id="eyeL"></div>
        <div class="eye right" id="eyeR"></div>
        <div class="blush left" id="blushL"></div>
        <div class="blush right" id="blushR"></div>
        <div class="mouth smile" id="mouth"></div>
      </div>
      <div class="body-top"></div>
      <div class="poyon-bumps">
        <div class="bump left"></div>
        <div class="bump right"></div>
      </div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="skirt"></div>
    </div>

    <div class="speech hidden" id="speech">いらっしゃ〜い♡</div>
    <div class="fx-overlay" id="fxOverlay"></div>
  </div>

  <div class="actions">
    <button class="act-btn" id="actDrink">
      <div class="ico">🍶</div>
      <div>お酌</div>
      <div class="cost">-500円</div>
    </button>
    <button class="act-btn" id="actGift">
      <div class="ico">🎁</div>
      <div>プレゼント</div>
      <div class="cost">-1500円</div>
    </button>
    <button class="act-btn" id="actSing">
      <div class="ico">🎤</div>
      <div>デュエット</div>
      <div class="cost">-1000円</div>
    </button>
    <button class="act-btn" id="actKuchi">
      <div class="ico">💋</div>
      <div>口説く</div>
      <div class="cost">タイミング</div>
    </button>
  </div>
</div>

<button class="menu-btn" id="btnMenu">≡</button>
<div class="menu-pop" id="menu">
  <button id="btnRestart">最初から</button>
  <button id="btnCloseMenu">閉じる</button>
</div>

<div id="minigame">
  <div class="mg-title" id="mgTitle">白いゾーンでタップ!!<br>(3回中2回成功で大成功)</div>
  <div class="mg-bar-wrap">
    <div class="mg-bar" id="mgBar"></div>
    <div class="mg-target" id="mgTarget"></div>
  </div>
  <button class="mash-btn" id="mashBtn">💋<br>NOW!!</button>
  <div class="mg-counter" id="mgCounter">残り: 3 回 / 成功: 0</div>
</div>

<div id="ending">
  <div class="big-emoji" id="endEmoji">👰</div>
  <h1 id="endTitle">エンディング</h1>
  <div class="rank-display" id="endRank">S</div>
  <p id="endText">エンディングテキスト</p>
  <button class="start-btn" id="btnPlayAgain" style="margin-top:20px;">もう一度</button>
</div>

<script>
const $ = id => document.getElementById(id);
const rand = (a,b) => Math.random()*(b-a)+a;
const irand = (a,b) => Math.floor(rand(a,b+1));

function bindTap(el, fn) {
  if (!el) return;
  let lock = false;
  const wrap = (e) => {
    if (lock) return;
    lock = true;
    setTimeout(() => { lock = false; }, 250);
    if (e.cancelable) e.preventDefault();
    fn(e);
  };
  el.addEventListener("touchend", wrap, { passive: false });
  el.addEventListener("click", wrap);
}

const state = {
  love: 0, drunk: 0, money: 5000, stage: 1, ended: false
};

function updateHUD() {
  $("barLove").style.width = Math.min(100, state.love) + "%";
  $("txtLove").textContent = Math.min(100, Math.floor(state.love)) + "/100";
  $("barDrunk").style.width = Math.min(100, state.drunk) + "%";
  $("txtDrunk").textContent = Math.min(100, Math.floor(state.drunk)) + "/100";
  $("barMoney").style.width = Math.min(100, state.money/100) + "%";
  $("txtMoney").textContent = state.money + "円";

  const newStage = state.love < 30 ? 1 : state.love < 60 ? 2 : state.love < 90 ? 3 : 4;
  if (newStage !== state.stage) {
    state.stage = newStage;
    updateStage();
  }
  updateFace();
}

function updateStage() {
  const labels = {
    1: "STAGE 1: お通し",
    2: "STAGE 2: 仲良くなった",
    3: "STAGE 3: いい感じ💕",
    4: "STAGE 4: 極上タイム🔥"
  };
  $("sceneLabel").textContent = labels[state.stage];
  showSpeech(["ねぇ、もう一杯飲も?","ちょっと近づいてもいい?","ねぇ…2人きりになりたい…♡","だ・い・す・き♡♡♡"][state.stage-1]);
  if (state.stage === 4) {
    document.querySelector(".disco-light").style.animationDuration = "2s";
    spawnConfetti(60);
    flash("rainbow");
  }
}

function updateFace() {
  const poyon = $("poyon");
  poyon.classList.remove("drunk", "happy");
  if (state.drunk > 70) poyon.classList.add("drunk");
  else if (state.love > 60) poyon.classList.add("happy");

  const eyeL = $("eyeL"), eyeR = $("eyeR");
  const mouth = $("mouth");
  const blushL = $("blushL"), blushR = $("blushR");
  eyeL.className = "eye left";
  eyeR.className = "eye right";
  mouth.className = "mouth";
  blushL.className = "blush left";
  blushR.className = "blush right";

  if (state.drunk > 80) {
    eyeL.classList.add("swirl");
    eyeR.classList.add("swirl");
    mouth.classList.add("shock");
    blushL.classList.add("deep");
    blushR.classList.add("deep");
  } else if (state.love > 80) {
    eyeL.classList.add("heart");
    eyeR.classList.add("heart");
    mouth.classList.add("kiss");
    blushL.classList.add("deep");
    blushR.classList.add("deep");
  } else if (state.love > 40 || state.drunk > 40) {
    mouth.classList.add("smile");
  }
}

function showSpeech(text, dur=2200) {
  const s = $("speech");
  s.textContent = text;
  s.classList.remove("hidden");
  clearTimeout(s._t);
  s._t = setTimeout(() => s.classList.add("hidden"), dur);
}

function floatIcon(emoji, x, y) {
  const el = document.createElement("div");
  el.className = "float-icon";
  el.textContent = emoji;
  el.style.left = x + "px";
  el.style.top = y + "px";
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function boomText(text, x, y) {
  const el = document.createElement("div");
  el.className = "boom-text";
  el.textContent = text;
  el.style.left = x + "px";
  el.style.top = y + "px";
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function flash(type) {
  const overlay = $("fxOverlay");
  const el = document.createElement("div");
  el.className = "flash-" + (type || "white");
  overlay.appendChild(el);
  setTimeout(() => el.remove(), type === "rainbow" ? 1000 : 500);
}

function shakeScreen() {
  const g = $("game");
  g.classList.remove("shake-screen");
  void g.offsetWidth;
  g.classList.add("shake-screen");
  setTimeout(() => g.classList.remove("shake-screen"), 300);
}

function shakePoyon() {
  const p = $("poyon");
  p.classList.remove("shake");
  void p.offsetWidth;
  p.classList.add("shake");
  setTimeout(() => p.classList.remove("shake"), 400);
}

function spawnConfetti(n) {
  n = n || 30;
  const colors = ["#ff006e","#ffeb3b","#00ff7f","#00bfff","#ff8c00","#ff1493"];
  for (let i=0; i<n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = rand(0,100) + "%";
    c.style.background = colors[irand(0,colors.length-1)];
    c.style.animationDuration = rand(2,4) + "s";
    c.style.animationDelay = rand(0,1) + "s";
    if (Math.random() > 0.5) c.style.borderRadius = "50%";
    $("stage").appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

let audioCtx = null;
function beep(freq, dur, type, vol) {
  freq = freq || 440; dur = dur || 0.1; type = type || "square"; vol = vol == null ? 0.1 : vol;
  try {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function poyonSound() {
  beep(800, 0.08, "sine", 0.15);
  setTimeout(() => beep(1200, 0.1, "sine", 0.12), 50);
  setTimeout(() => beep(600, 0.15, "sine", 0.1), 130);
}
function kissSound() {
  beep(1500, 0.05, "sine", 0.15);
  setTimeout(() => beep(2000, 0.1, "sine", 0.12), 60);
}
function drinkSound() {
  for (let i=0; i<5; i++) {
    setTimeout(() => beep(200+i*50, 0.06, "triangle", 0.08), i*60);
  }
}

function onPoyonTap(e) {
  const stage = $("stage");
  const r = stage.getBoundingClientRect();
  const t = e.touches?.[0] || e.changedTouches?.[0];
  const cx = t ? t.clientX : (e.clientX || r.width/2);
  const cy = t ? t.clientY : (e.clientY || r.height/2);
  const x = cx - r.left;
  const y = cy - r.top;

  const poyon = $("poyon");
  const pr = poyon.getBoundingClientRect();
  const relY = cy - pr.top;

  shakePoyon();
  poyonSound();

  let gain = 1;
  let icon = "💕";
  let words = ["きゃっ♡", "もぉ〜♡", "やん♡", "えへへ♡", "もっと…?"];

  if (relY < 100) {
    icon = "✨";
    words = ["なでなで気持ちいい〜♡", "やさし〜♪", "そこ好き♡"];
    gain = 2;
  } else if (relY < 200) {
    icon = "💕";
    words = ["きゃーーっ!!", "もぉっ!エッチ♡", "そこは…ダメ♡", "ぽよ〜ん♡"];
    gain = 4;
    boomText("ぽよん!!", x, y);
    flash("white");
  } else {
    icon = "💢";
    words = ["こ・の・へ・ん・た・い!", "セクハラで通報するよ?", "そこは触っちゃダメ!!"];
    gain = -3;
    flash("red");
    shakeScreen();
  }

  for (let i=0; i<3; i++) {
    setTimeout(() => floatIcon(icon, x + rand(-30,30), y + rand(-20,20)), i*80);
  }

  showSpeech(words[irand(0, words.length-1)]);
  state.love = Math.max(0, state.love + gain);
  if (gain < 0) state.drunk = Math.max(0, state.drunk - 2);
  updateHUD();
  checkEnding();
}

function doDrink() {
  if (state.money < 500) { showSpeech("お金…足りないみたい…"); return; }
  state.money -= 500;
  state.drunk += irand(15, 25);
  state.love += irand(3, 8);
  drinkSound();
  showSpeech(["かんぱ〜い♡", "んくっ…んく…ぷはっ!", "おいしい〜♡"][irand(0,2)]);
  for (let i=0; i<5; i++) {
    setTimeout(() => floatIcon("🍺", rand(80, 320), rand(150,300)), i*80);
  }
  shakePoyon();
  if (state.drunk > 95) {
    state.drunk = 95;
    showSpeech("う゛…もう飲めない…");
  }
  updateHUD();
  checkEnding();
}

function doGift() {
  if (state.money < 1500) { showSpeech("お金…足りないよ…"); return; }
  state.money -= 1500;
  state.love += irand(15, 25);
  flash("white");
  spawnConfetti(20);
  showSpeech(["わ〜!ありがとう♡", "うれしい〜!!♡♡", "そんな…でも、もらっちゃう♡"][irand(0,2)]);
  const gifts = ["🎁","💎","💐","💍","🧸"];
  for (let i=0; i<8; i++) {
    setTimeout(() => floatIcon(gifts[irand(0,gifts.length-1)], rand(50,350), rand(150,350)), i*80);
  }
  beep(660, 0.1); setTimeout(()=>beep(880,0.1), 100); setTimeout(()=>beep(1100,0.2),200);
  updateHUD();
  checkEnding();
}

function doSing() {
  if (state.money < 1000) { showSpeech("お金…ないって…"); return; }
  state.money -= 1000;
  state.love += irand(8, 15);
  showSpeech("🎵あ〜なたとデュエット〜🎵");
  const notes = ["🎵","🎶","🎤","♪","♫"];
  let i = 0;
  const iv = setInterval(() => {
    floatIcon(notes[irand(0,notes.length-1)], rand(50,350), rand(150,350));
    beep(440 + irand(-100,400), 0.1, "sine", 0.08);
    if (++i > 10) clearInterval(iv);
  }, 150);
  updateHUD();
  checkEnding();
}

function doKuchi() {
  startMinigame();
}

let mgInterval = null;
let mgPos = 0;
let mgDir = 1;
let mgTries = 3;
let mgSuccesses = 0;

function startMinigame() {
  $("minigame").classList.add("show");
  mgPos = 0;
  mgDir = 1;
  mgTries = 3;
  mgSuccesses = 0;
  $("mgCounter").textContent = "残り: " + mgTries + " 回 / 成功: 0";
  if (mgInterval) clearInterval(mgInterval);
  mgInterval = setInterval(() => {
    mgPos += mgDir * 2.5;
    if (mgPos >= 100) { mgPos = 100; mgDir = -1; }
    if (mgPos <= 0) { mgPos = 0; mgDir = 1; }
    $("mgBar").style.width = mgPos + "%";
  }, 25);
}

function mashTap() {
  beep(800, 0.1);
  if (mgPos >= 60 && mgPos <= 80) {
    mgSuccesses++;
    boomText("ナイス!!", rand(80, 280), rand(150, 350));
    kissSound();
  } else {
    boomText("おしい!", rand(80, 280), rand(150, 350));
  }
  mgTries--;
  $("mgCounter").textContent = "残り: " + mgTries + " 回 / 成功: " + mgSuccesses;
  if (mgTries <= 0) {
    setTimeout(endMinigame, 600);
  }
}

function endMinigame() {
  clearInterval(mgInterval);
  mgInterval = null;
  $("minigame").classList.remove("show");
  if (mgSuccesses >= 2) {
    state.love += 30;
    flash("rainbow");
    spawnConfetti(40);
    showSpeech("もぉ…キミの口説き方、ズルすぎ…♡");
    for (let i=0; i<10; i++) setTimeout(() => floatIcon("💋", rand(50,350), rand(150,400)), i*80);
  } else if (mgSuccesses === 1) {
    state.love += 5;
    showSpeech("ふ〜ん、まあまあかな?");
  } else {
    state.love -= 5;
    showSpeech("ちょっと…ナシかな…");
    flash("red");
    shakeScreen();
  }
  updateHUD();
  checkEnding();
}

function checkEnding() {
  if (state.ended) return;

  if (state.money <= 0 && state.love < 80) {
    return triggerEnding({
      emoji: "💸",
      title: "金欠エンド",
      rank: "F",
      text: "君は無一文になった。\nぽよんちゃんは次のお客さんに笑顔を向けていた。\n所詮、そんなもんだ。"
    });
  }

  if (state.drunk >= 95 && state.love < 70) {
    return triggerEnding({
      emoji: "🤮",
      title: "介護エンド",
      rank: "D",
      text: "酔い潰れたぽよんちゃんを介抱して、\n君は朝までトイレで彼女の背中をさすっていた。\n…これも青春?"
    });
  }

  if (state.love >= 100) {
    return triggerEnding({
      emoji: "👰💍",
      title: "プロポーズ大成功エンド",
      rank: "SS",
      text: "「キミと…結婚したい」\n勢いで言った言葉に、\nぽよんちゃんは涙を浮かべて頷いた。\n\n3年後、君らは元気な双子のママとパパに。\nスナック『ぽよん』は今も繁盛中。"
    });
  }
}

function triggerEnding(data) {
  state.ended = true;
  $("endEmoji").textContent = data.emoji;
  $("endTitle").textContent = "🎉 " + data.title + " 🎉";
  $("endRank").textContent = data.rank;
  $("endText").textContent = data.text;
  $("ending").classList.add("show");
  spawnConfetti(80);
  flash("rainbow");
}

setInterval(() => {
  if (state.ended) return;
  if (state.drunk > 0) {
    state.drunk = Math.max(0, state.drunk - 0.5);
    updateHUD();
  }
}, 1000);

setInterval(() => {
  if (state.ended) return;
  if (Math.random() < 0.15) {
    const events = [
      () => { showSpeech("お通しサービスです♡ (-500円)"); state.money = Math.max(0, state.money - 500); updateHUD(); },
      () => { showSpeech("ねぇ、見て見て〜♪"); floatIcon("✨", 200, 200); state.love += 2; updateHUD(); },
      () => { showSpeech("ちょっと暑くない?"); flash("white"); },
      () => { showSpeech("お客さん、いいネクタイ〜♡"); state.love += 3; updateHUD(); }
    ];
    events[irand(0, events.length-1)]();
  }
}, 8000);

function startGame() {
  $("title").classList.add("hidden");
  state.love = 0;
  state.drunk = 0;
  state.money = 5000;
  state.stage = 1;
  state.ended = false;
  $("ending").classList.remove("show");
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  poyonSound();
  showSpeech("いらっしゃ〜い♡");
  updateHUD();
  spawnConfetti(20);
}

function restart() {
  $("ending").classList.remove("show");
  $("title").classList.remove("hidden");
  $("menu").classList.remove("show");
}

function init() {
  bindTap($("btnStart"), startGame);
  bindTap($("btnPlayAgain"), () => {
    $("ending").classList.remove("show");
    startGame();
  });
  bindTap($("btnMenu"), () => $("menu").classList.toggle("show"));
  bindTap($("btnRestart"), restart);
  bindTap($("btnCloseMenu"), () => $("menu").classList.remove("show"));

  bindTap($("poyon"), onPoyonTap);
  bindTap($("actDrink"), doDrink);
  bindTap($("actGift"), doGift);
  bindTap($("actSing"), doSing);
  bindTap($("actKuchi"), doKuchi);
  bindTap($("mashBtn"), mashTap);
}

if (document.readyState !== "loading") init();
else document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
